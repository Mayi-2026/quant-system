<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蚂蚁量化系统 · 模拟交易</title>
<style>
  :root{--up:#E03131;--down:#2F9E44;--flat:#8A8F99;--brand:#0969DA;--ink:#1A1D24;--ink2:#5B6270;--ink3:#8A8F99;--line:#E7E9EE;--bg:#F4F5F7;--card:#FFFFFF;--bg-soft:#F7F9FC;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 2px rgba(16,24,40,.06);--radius:14px;--mono:"SF Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
  .sidebar{background:#0E2A52;color:#D6E4F5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1C7ED6,#4DABF7);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .brand .name{font-size:16px;font-weight:700;color:#fff}
  .brand .sub{font-size:11px;color:#8FA9C9;margin-top:1px}
  .nav{padding:12px 10px;flex:1;overflow-y:auto}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#C7D8EC;text-decoration:none;font-size:14px;margin-bottom:2px}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav a.active{background:#1C7ED6;color:#fff;font-weight:600}
  .sidebar .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#7E97B8}
  .sidebar .foot .row{display:flex;justify-content:space-between;margin-bottom:6px}
  .sidebar .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#12B886;margin-right:5px}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:10}
  .topbar .crumb{font-size:15px;font-weight:650}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 14px;font-size:13px;color:var(--ink2);cursor:pointer}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:#0759B9}
  .btn.danger{background:#E03131;border-color:#E03131;color:#fff;font-weight:600}
  .btn.success{background:#2F9E44;border-color:#2F9E44;color:#fff;font-weight:600}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4DABF7,#37B24D);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-left:auto}
  .content{padding:22px 24px 40px;max-width:1380px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .page-head h1{font-size:20px;font-weight:700}
  .page-head .desc{font-size:13px;color:var(--ink3);margin-top:3px}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .kpi-card .label{font-size:12px;color:var(--ink3)}
  .kpi-card .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi-card .delta{font-size:12px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .grid.full{grid-template-columns:1fr}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px;border-bottom:1px solid var(--line)}
  .panel .hd .t{font-size:14px;font-weight:650}
  .panel .hd .actions{display:flex;gap:8px}
  .panel .bd{padding:12px 16px 14px;flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--ink3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #F0F2F5;white-space:nowrap;font-variant-numeric:tabular-nums}
  .num{text-align:right}
  .tg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
  .tg.ok{background:#EBFBEE;color:var(--down)}
  .tg.run{background:#E7F5FF;color:var(--brand)}
  .tg.warn{background:#FFF9DB;color:#E67700}
  .tg.err{background:#FFE3E3;color:var(--up)}
  .tg.buy{background:#FFE3E3;color:var(--up)}
  .tg.sell{background:#EBFBEE;color:var(--down)}
  .loading{text-align:center;padding:40px;color:var(--ink3)}
  .empty{text-align:center;padding:30px;color:var(--ink3);font-size:13px}
  .form-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .form-row label{font-size:13px;color:var(--ink2);min-width:70px}
  .form-row input,.form-row select{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;background:var(--card)}
  .form-row input:focus,.form-row select:focus{border-color:var(--brand)}
  .log-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .log-item{display:flex;gap:8px;padding:6px 10px;background:var(--bg-soft);border-radius:8px;font-size:12px;align-items:flex-start}
  .log-item .time{color:var(--ink3);white-space:nowrap;min-width:130px}
  .log-item .msg{flex:1;word-break:break-all}
  .log-item.error{background:#FFF5F5}
  .log-item.signal{background:#F0F9FF}
  .log-item.fill{background:#F0FFF4}
  .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:var(--card);border-radius:var(--radius);padding:24px;width:420px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
  .modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
  .modal .close{float:right;cursor:pointer;font-size:18px;color:var(--ink3)}
  @media(max-width:960px){.app{grid-template-columns:1fr}.sidebar{display:none}.kpi{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">Q</div>
      <div><div class="name">蚂蚁量化系统</div><div class="sub">个人量化交易平台</div></div>
    </div>
    <nav class="nav">
      <a href="/"><span>📊</span>总览首页</a>
      <a href="/positions"><span>💼</span>持仓管理</a>
      <a href="/market"><span>🌍</span>市场洞察</a>
      <a href="/strategies"><span>📈</span>策略管理</a>
      <a href="/scan"><span>🔍</span>策略选股</a>
      <a href="/data"><span>💾</span>数据中心</a>
      <a href="/trades"><span>📋</span>交易记录</a>
      <a class="active" href="/paper"><span>🎮</span>模拟交易</a>
      <a href="/watchlist"><span>⭐</span>自选股票</a>
      <a href="/sequoia"><span>🎯</span>Sequoia选股</a>
    </nav>
    <div class="foot">
      <div class="row"><span>行情数据</span><span class="mono"><span class="dot"></span>已连接</span></div>
      <div class="row"><span>数据源</span><span class="mono">AKShare</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="crumb">模拟交易</span>
      <button class="btn" onclick="refreshAll()">刷新数据</button>
      <button class="btn primary" onclick="showOrderModal()">手动下单</button>
      <button class="btn success" onclick="executeSignals()">执行策略信号</button>
      <div class="avatar">乔</div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <h1>模拟交易</h1>
          <div class="desc">基于策略信号自动生成交易指令，实时模拟成交</div>
        </div>
        <div style="display:flex;gap:8px">
          <select id="accountSelect" onchange="onAccountChange()" style="border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px"></select>
          <button class="btn" onclick="showCreateAccountModal()">+ 新建账户</button>
        </div>
      </div>

      <div class="kpi" id="kpi"><div class="loading">加载中...</div></div>

      <div class="grid">
        <div class="panel">
          <div class="hd">
            <span class="t">模拟持仓</span>
            <span style="font-size:12px;color:var(--ink3)" id="posCount"></span>
          </div>
          <div class="bd" style="padding:6px 12px 10px">
            <table>
              <thead><tr><th>名称/代码</th><th class="num">数量</th><th class="num">成本</th><th class="num">现价</th><th class="num">盈亏</th></tr></thead>
              <tbody id="posBody"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="hd">
            <span class="t">最近订单</span>
            <span style="font-size:12px;color:var(--ink3)" id="orderCount"></span>
          </div>
          <div class="bd" style="padding:6px 12px 10px">
            <table>
              <thead><tr><th>时间</th><th>名称</th><th>方向</th><th class="num">数量</th><th class="num">成交价</th><th>状态</th></tr></thead>
              <tbody id="orderBody"><tr><td colspan="6" class="loading">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="grid full">
        <div class="panel">
          <div class="hd">
            <span class="t">交易日志</span>
            <div class="actions">
              <button class="btn" onclick="loadLogs()" style="padding:4px 10px;font-size:12px">刷新</button>
            </div>
          </div>
          <div class="bd">
            <div class="log-list" id="logList"><div class="loading">加载中...</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 下单弹窗 -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <span class="close" onclick="hideOrderModal()">&times;</span>
    <h3>手动下单</h3>
    <div class="form-row">
      <label>股票代码</label>
      <input id="orderSymbol" placeholder="如 600519.SH" style="flex:1">
    </div>
    <div class="form-row">
      <label>方向</label>
      <select id="orderDirection" style="flex:1">
        <option value="buy">买入</option>
        <option value="sell">卖出</option>
      </select>
    </div>
    <div class="form-row">
      <label>数量（股）</label>
      <input id="orderQuantity" type="number" value="100" min="100" step="100" style="flex:1">
    </div>
    <div class="form-row">
      <label>订单类型</label>
      <select id="orderType" style="flex:1">
        <option value="market">市价单</option>
        <option value="limit">限价单</option>
      </select>
    </div>
    <div class="form-row">
      <label>委托价格</label>
      <input id="orderPrice" type="number" step="0.01" placeholder="市价单可不填" style="flex:1">
    </div>
    <div class="form-row">
      <label>信号原因</label>
      <input id="orderReason" placeholder="可选" style="flex:1">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn primary" onclick="submitOrder()" style="flex:1">确认下单</button>
      <button class="btn" onclick="hideOrderModal()">取消</button>
    </div>
  </div>
</div>

<!-- 新建账户弹窗 -->
<div class="modal-overlay" id="createAccountModal">
  <div class="modal">
    <span class="close" onclick="hideCreateAccountModal()">&times;</span>
    <h3>新建模拟账户</h3>
    <div class="form-row">
      <label>账户名称</label>
      <input id="newAccountName" value="模拟盘" style="flex:1">
    </div>
    <div class="form-row">
      <label>初始资金</label>
      <input id="newAccountCapital" type="number" value="1000000" step="100000" style="flex:1">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn primary" onclick="createAccount()" style="flex:1">创建</button>
      <button class="btn" onclick="hideCreateAccountModal()">取消</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
let currentAccountId = null;

async function init() {
  try {
    const accounts = await api.getPaperAccounts();
    if (!accounts || !accounts.length) {
      // 自动创建默认账户
      const res = await api.createPaperAccount({ name: '模拟盘', initial_capital: 1000000 });
      currentAccountId = res.id;
    } else {
      currentAccountId = accounts[0].id;
    }
    renderAccountSelect(accounts.length ? accounts : [{ id: currentAccountId, name: '模拟盘' }]);
    await refreshAll();
  } catch (e) {
    console.error('初始化失败', e);
  }
}

function renderAccountSelect(accounts) {
  const sel = document.getElementById('accountSelect');
  sel.innerHTML = accounts.map(a => `<option value="${a.id}" ${a.id === currentAccountId ? 'selected' : ''}>${a.name} (#${a.id})</option>`).join('');
}

function onAccountChange() {
  currentAccountId = parseInt(document.getElementById('accountSelect').value);
  refreshAll();
}

async function refreshAll() {
  if (!currentAccountId) return;
  await Promise.all([loadSummary(), loadPositions(), loadOrders(), loadLogs()]);
}

async function loadSummary() {
  try {
    const d = await api.getPaperAccount(currentAccountId);
    const items = [
      { label: '总资产', val: '￥' + fmt(d.total_value, 0), delta: '初始 ￥' + fmt(d.initial_capital, 0) },
      { label: '累计收益', val: (d.total_return >= 0 ? '+' : '') + fmt(d.total_return, 0), cls: signCls(d.total_return), delta: (d.total_return_pct >= 0 ? '+' : '') + fmt(d.total_return_pct) + '%' },
      { label: '持仓市值', val: '￥' + fmt(d.position_value, 0), delta: d.position_count + ' 只持仓' },
      { label: '可用资金', val: '￥' + fmt(d.current_cash, 0), delta: '仓位 ' + fmt(d.position_value / d.total_value * 100, 0) + '%' },
    ];
    document.getElementById('kpi').innerHTML = items.map(k =>
      `<div class="kpi-card"><span class="label">${k.label}</span><span class="val ${k.cls || ''}">${k.val}</span><span class="delta ${k.cls || ''}">${k.delta}</span></div>`
    ).join('');
  } catch (e) { console.error(e); }
}

async function loadPositions() {
  try {
    const positions = await api.getPaperPositions(currentAccountId);
    document.getElementById('posCount').textContent = positions.length + ' 只';
    if (!positions.length) {
      document.getElementById('posBody').innerHTML = '<tr><td colspan="5" class="empty">暂无持仓，执行策略信号或手动下单</td></tr>';
      return;
    }
    document.getElementById('posBody').innerHTML = positions.map(p => {
      const cls = signCls(p.profit_loss_pct);
      return `<tr>
        <td><div style="font-weight:600">${p.name || p.symbol}</div><div style="font-size:11px;color:var(--ink3)">${p.symbol}</div></td>
        <td class="num">${p.quantity}</td>
        <td class="num">${fmt(p.avg_cost)}</td>
        <td class="num">${fmt(p.current_price)}</td>
        <td class="num ${cls}">${p.profit_loss >= 0 ? '+' : ''}${fmt(p.profit_loss, 0)} (${p.profit_loss_pct >= 0 ? '+' : ''}${fmt(p.profit_loss_pct)}%)</td>
      </tr>`;
    }).join('');
  } catch (e) { console.error(e); }
}

async function loadOrders() {
  try {
    const orders = await api.getPaperOrders(currentAccountId);
    document.getElementById('orderCount').textContent = orders.length + ' 笔';
    if (!orders.length) {
      document.getElementById('orderBody').innerHTML = '<tr><td colspan="6" class="empty">暂无订单</td></tr>';
      return;
    }
    document.getElementById('orderBody').innerHTML = orders.slice(0, 20).map(o => {
      const dirCls = o.direction === 'buy' ? 'buy' : 'sell';
      const dirText = o.direction === 'buy' ? '买入' : '卖出';
      const statusMap = { filled: ['已成交', 'ok'], pending: ['待成交', 'warn'], cancelled: ['已取消', ''], rejected: ['已拒绝', 'err'] };
      const [statusText, statusCls] = statusMap[o.status] || [o.status, ''];
      const time = o.filled_at || o.created_at || '';
      const shortTime = time ? time.substring(5, 16).replace('T', ' ') : '';
      return `<tr>
        <td style="font-size:12px;color:var(--ink3)">${shortTime}</td>
        <td><span style="font-weight:600">${o.name || o.symbol}</span></td>
        <td><span class="tg ${dirCls}">${dirText}</span></td>
        <td class="num">${o.filled_quantity || o.quantity}</td>
        <td class="num">${o.filled_price ? fmt(o.filled_price) : '-'}</td>
        <td><span class="tg ${statusCls}">${statusText}</span></td>
      </tr>`;
    }).join('');
  } catch (e) { console.error(e); }
}

async function loadLogs() {
  try {
    const logs = await api.getPaperLogs(currentAccountId);
    if (!logs.length) {
      document.getElementById('logList').innerHTML = '<div class="empty">暂无日志</div>';
      return;
    }
    document.getElementById('logList').innerHTML = logs.slice(0, 50).map(l => {
      let cls = '';
      if (l.level === 'error') cls = 'error';
      else if (l.event_type === 'signal') cls = 'signal';
      else if (l.event_type === 'fill') cls = 'fill';
      const time = l.created_at ? l.created_at.substring(5, 16).replace('T', ' ') : '';
      return `<div class="log-item ${cls}"><span class="time mono">${time}</span><span class="msg">${l.message}</span></div>`;
    }).join('');
  } catch (e) { console.error(e); }
}

function showOrderModal() { document.getElementById('orderModal').classList.add('show'); }
function hideOrderModal() { document.getElementById('orderModal').classList.remove('show'); }
function showCreateAccountModal() { document.getElementById('createAccountModal').classList.add('show'); }
function hideCreateAccountModal() { document.getElementById('createAccountModal').classList.remove('show'); }

async function submitOrder() {
  const symbol = document.getElementById('orderSymbol').value.trim();
  const direction = document.getElementById('orderDirection').value;
  const quantity = parseInt(document.getElementById('orderQuantity').value);
  const orderType = document.getElementById('orderType').value;
  const price = parseFloat(document.getElementById('orderPrice').value) || null;
  const reason = document.getElementById('orderReason').value.trim() || null;

  if (!symbol) { alert('请输入股票代码'); return; }
  if (!quantity || quantity < 100) { alert('数量至少 100 股'); return; }

  try {
    const result = await api.placePaperOrder(currentAccountId, { symbol, direction, quantity, order_type: orderType, price, reason });
    if (result.status === 'rejected') {
      alert('下单被拒绝，请检查资金或持仓');
    } else {
      alert(`下单成功！${result.direction === 'buy' ? '买入' : '卖出'} ${result.name} ${result.filled_quantity}股 @ ${result.filled_price}`);
    }
    hideOrderModal();
    refreshAll();
  } catch (e) {
    alert('下单失败: ' + e.message);
  }
}

async function createAccount() {
  const name = document.getElementById('newAccountName').value.trim() || '模拟盘';
  const capital = parseFloat(document.getElementById('newAccountCapital').value) || 1000000;
  try {
    const res = await api.createPaperAccount({ name, initial_capital: capital });
    currentAccountId = res.id;
    hideCreateAccountModal();
    const accounts = await api.getPaperAccounts();
    renderAccountSelect(accounts);
    refreshAll();
  } catch (e) {
    alert('创建失败: ' + e.message);
  }
}

async function executeSignals() {
  if (!confirm('确定要执行所有运行中策略的信号吗？')) return;
  try {
    const result = await api.executePaperSignals(currentAccountId);
    if (result.signals === 0) {
      alert('当前无交易信号');
    } else {
      alert(`生成 ${result.signals} 个信号，执行 ${result.orders} 笔订单`);
    }
    refreshAll();
  } catch (e) {
    alert('执行失败: ' + e.message);
  }
}

init();
</script>
</body>
</html>
